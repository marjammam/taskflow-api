
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>

    <style>
        /* ===== CONFIGURACIÓN GENERAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f5f7fa,
                #e8edf2
            );

            color: #263238;
        }


        /* ===== CONTENEDOR ===== */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        /* ===== ENCABEZADO ===== */
        .header {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }


        .header h1 {

            font-size: 30px;

            font-weight: 600;

            color: #263238;

            margin-bottom: 7px;
        }


        .header p {

            color: #78909c;

            font-size: 14px;
        }


        /* ===== TARJETA DE TAREAS ===== */

        .tasks-card {

            background: #ffffff;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .tasks-card h2 {

            font-size: 21px;

            color: #37474f;

            margin-bottom: 20px;
        }


        /* ===== LISTA ===== */

        .task-list {

            list-style: none;
        }


        .task-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 18px 20px;

            margin-bottom: 12px;

            background: #f8fafb;

            border: 1px solid #e5e9ec;

            border-radius: 12px;

            transition: all 0.2s ease;
        }


        .task-item:hover {
            background: #ffffff;
            border-color: #b0bec5;
            transform: translateX(3px);
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.06);
        }

        /* ===== INFORMACIÓN DE LA TAREA ===== */

        .task-info {
            flex: 1;
        }

        .task-title {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #37474f;
            margin-bottom: 6px;
        }


        .task-project {

            font-size: 13px;
            color: #90a4ae;
        }


        /* ===== ESTADO ===== */

        .task-status {
            padding: 7px 14px;
            border-radius: 20px;
            background: #8ef5bc;
            color: #547a6d;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }


        /* ===== SIN TAREAS ===== */

        .empty {
            text-align: center;
            padding: 40px 20px;
            background: #f8fafb;
            border: 1px dashed #cfd8dc;
            border-radius: 12px;
            color: #90a4ae;
            font-size: 14px;
        }


        /* ===== ACCIONES ===== */

        .actions {

            margin-top: 25px;

            display: flex;

            justify-content: center;
        }


        .btn-create {

            display: inline-block;

            padding: 13px 25px;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #37474f,
                #546e7a
            );

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: all 0.2s ease;
        }


        .btn-create:hover {

            background: linear-gradient(
                135deg,
                #263238,
                #455a64
            );

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(55, 71, 79, 0.25);
        }


        /* ===== RESPONSIVE ===== */

        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin: 25px auto;
            }


            .header {

                padding: 25px;
            }


            .header h1 {

                font-size: 26px;
            }


            .tasks-card {

                padding: 22px;
            }


            .task-item {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }


            .task-status {

                align-self: flex-start;
            }

        }

    </style>

</head>


<body>
    <div class="container">
        <!-- ENCABEZADO -->
        <div class="header">
            <h1>
                Mis tareas
            </h1>
            <p>
                Consulta y administra las tareas de tus proyectos
            </p>
        </div>
        <!-- TAREAS -->
        <div class="tasks-card">
            <h2>
                Lista de tareas
            </h2>
            <ul class="task-list">
                {% for tarea in tareas %}
                    <li class="task-item">
                        <div class="task-info">
                            <span class="task-title">
                                {{ tarea.titulo }}
                            </span>
                            <span class="task-project">
                                Proyecto: {{ tarea.proyecto.nombre }}
                            </span>
                        </div>
                        <span class="task-status">
                            {{ tarea.estado }}
                        </span>
                    </li>

                {% empty %}
                    <li class="empty">
                        No tienes tareas todavía.
                    </li>
                {% endfor %}
            </ul>
            <!-- BOTÓN -->
            <div class="actions">
                <a
                    href="{% url 'crear_tarea' %}"
                    class="btn-create">
                    + Crear nueva tarea
                </a>
            </div>
        </div>
    </div>
</body>

</html>
