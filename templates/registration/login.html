
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #f5f7fa,
                #e8edf2
            );

            color: #333;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.10),
                0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .login-card h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 600;
            color: #263238;
            margin-bottom: 10px;
        }

        .login-description {
            text-align: center;
            color: #78909c;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #455a64;
        }

        form input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid #d5dce3;
            border-radius: 10px;

            background: #f9fafb;

            font-size: 15px;
            outline: none;

            transition: 0.25s;
        }

        form input:focus {
            border-color: #607d8b;
            background: white;

            box-shadow:
                0 0 0 3px rgba(96, 125, 139, 0.12);
        }

        button {
            width: 100%;
            margin-top: 5px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #37474f,
                #546e7a
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: linear-gradient(
                135deg,
                #263238,
                #455a64
            );

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(55, 71, 79, 0.25);
        }

        /* REGISTRO */

        .register-section {
            text-align: center;
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;
        }

        .register-section p {
            font-size: 14px;
            color: #78909c;
            margin-bottom: 8px;
        }

        .register-link {
            color: #455a64;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition: 0.2s;
        }

        .register-link:hover {
            color: #1976d2;
            text-decoration: underline;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #90a4ae;
        }

        .errorlist {
            list-style: none;
            color: #d32f2f;
            font-size: 13px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 25px;
            }

            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Iniciar sesión</h1>
            <p class="login-description">
                Ingresa tus credenciales para continuar
            </p>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">
                    Entrar
                </button>
            </form>
            <!-- REGISTRO -->
            <div class="register-section">
                <p>¿No tienes una cuenta?</p>
                <a href="/registro/" class="register-link">
                    Registrarse
                </a>
            </div>
            <div class="login-footer">
                Sistema de gestión
            </div>
        </div>
    </div>
</body>
</html>
