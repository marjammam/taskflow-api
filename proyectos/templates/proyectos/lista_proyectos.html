
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Proyectos</title>
    <style>

        /* ===== CONFIGURACIÓN GENERAL ===== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #f5f7fa,
                #e8edf2
            );

            color: #263238;
        }


        /* ===== CONTENEDOR ===== */

        .container {

            width: 90%;

            max-width: 900px;

            margin: 50px auto;
        }


        /* ===== ENCABEZADO ===== */

        .header {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }


        .header h1 {
            font-size: 30px;
            font-weight: 600;
            color: #263238;
            margin-bottom: 6px;
        }

        .header p {
            color: #78909c;
            font-size: 14px;
        }


        /* ===== LISTA DE PROYECTOS ===== */

        .projects-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .projects-card h2 {
            font-size: 21px;
            color: #37474f;
            margin-bottom: 20px;
        }

        .project-list {
            list-style: none;
        }
        /* ===== CADA PROYECTO ===== */

        .project-item {

            margin-bottom: 12px;
        }


        .project-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #f8fafb;
            border: 1px solid #e5e9ec;
            border-radius: 12px;
            text-decoration: none;
            color: #37474f;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
        }


        .project-link:hover {
            background: #ffffff;
            border-color: #90a4ae;
            transform: translateX(4px);
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.07);
        }


        .arrow {
            font-size: 20px;
            color: #78909c;
            transition: 0.2s;
        }


        .project-link:hover .arrow {
            transform: translateX(4px);
            color: #455a64;
        }


        /* ===== SIN PROYECTOS ===== */

        .empty {
            text-align: center;
            padding: 35px 20px;
            color: #90a4ae;
            background: #f8fafb;
            border-radius: 12px;
            border: 1px dashed #cfd8dc;
        }

        /* ===== BOTÓN CREAR ===== */

        .actions {
            margin-top: 25px;
            text-align: center;
        }

        .btn-create {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #37474f,
                #546e7a
            );
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-create:hover {
            background: linear-gradient(
                135deg,
                #263238,
                #455a64
            );
            transform: translateY(-2px);
            box-shadow:
                0 8px 18px rgba(55, 71, 79, 0.25);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 25px auto;
            }
            .header {
                padding: 25px;
                flex-direction: column;
                align-items: flex-start;
            }
            .header h1 {

                font-size: 26px;
            }


            .projects-card {

                padding: 22px;
            }
            .project-link {
                padding: 16px;
            }
        }

    </style>
</head>


<body>
    <div class="container">
        <!-- ENCABEZADO -->
        <div class="header">
            <div>
                <h1>
                    Mis proyectos
                </h1>
                <p>
                    Administra y consulta tus proyectos
                </p>
            </div>
        </div>

        <!-- LISTA -->
        <div class="projects-card">
            <h2>
                Proyectos
            </h2>
            <ul class="project-list">
                {% for proyecto in proyectos %}
                    <li class="project-item">

                        <a
                            href="{% url 'detalle_proyecto' proyecto.id %}"
                            class="project-link">

                            <span>
                                {{ proyecto.nombre }}
                            </span>

                            <span class="arrow">
                                →
                            </span>
                        </a>
                    </li>
                {% empty %}
                    <li class="empty">
                        No tienes proyectos todavía.
                    </li>
                {% endfor %}
            </ul>

            <!-- CREAR PROYECTO -->
            <div class="actions">
                <a
                    href="{% url 'crear_proyecto' %}"
                    class="btn-create">
                    + Crear nuevo proyecto
                </a>
            </div>
        </div>
    </div>

</body>

</html>
